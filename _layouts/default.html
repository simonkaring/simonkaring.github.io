<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <meta name="color-scheme" content="dark light">
    <meta name="theme-color" content="#151614">
    <title>{% if page.title %}{{ page.title | escape }} · {% endif %}{{ site.title | escape }}</title>
    <meta name="description" content="{{ page.description | default: site.description | escape }}">
    <link rel="canonical" href="{{ page.url | absolute_url }}">
    <meta property="og:type" content="website">
    <meta property="og:title" content="Simon Karing">
    <meta property="og:description" content="{{ site.description | escape }}">
    <meta property="og:url" content="{{ page.url | absolute_url }}">
    <link rel="icon" href="{{ '/assets/favicon.svg' | relative_url }}" type="image/svg+xml">
    <link rel="preload" href="{{ '/assets/fonts/space-grotesk-latin.woff2' | relative_url }}" as="font" type="font/woff2" crossorigin>
    <link rel="stylesheet" href="{{ '/assets/css/site.css' | relative_url }}">
    <script>
      try { const theme = localStorage.getItem('sk-theme'); if (theme === 'light' || theme === 'dark') document.documentElement.dataset.theme = theme; } catch (_) {}
    </script>
    <script type="module" src="{{ '/assets/js/main.js' | relative_url }}"></script>
  </head>
  <body>
    <a class="skip-link" href="#main">Skip to content</a>
    <header class="site-header page-width">
      <a class="wordmark" href="{{ '/' | relative_url }}" aria-label="sk. Simon Karing, home">sk<span aria-hidden="true">.</span></a>
      <nav aria-label="Main navigation">
        <a href="{{ '/#about' | relative_url }}">About</a>
        <a href="{{ '/#practice' | relative_url }}">Practice</a>
        <a class="external-link" href="https://github.com/simonkaring">GitHub <span aria-hidden="true">↗</span></a>
      </nav>
      <button class="theme-toggle" type="button" aria-label="Switch color theme" hidden><span class="theme-symbol" aria-hidden="true"></span><span data-theme-label>Light</span></button>
    </header>
    {{ content }}
    <footer class="site-footer page-width">
      <a href="{{ '/' | relative_url }}">Simon Karing</a>
      <a href="{{ '/config/mac/' | relative_url }}">Mac Config <span aria-hidden="true">↗</span></a>
      <span>Thoughtfully connected.</span>
    </footer>
  </body>
</html>
